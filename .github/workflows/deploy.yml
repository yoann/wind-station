# Builds the site and publishes only dist/ to GitHub Pages.
#
# Requires Settings -> Pages -> Source set to "GitHub Actions". While it is
# still "Deploy from a branch", this workflow succeeds but the live site keeps
# serving the branch, repo root and all.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # A regression blocks the deploy rather than shipping.
      - name: Unit tests
        run: npm test
      - name: DOM smoke test
        run: npm run test:dom

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
